name: Deploy GTT Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir _site

          cp index.html _site/
          cp about.html _site/
          cp reports.html _site/
          cp analysis.html _site/
          cp contact.html _site/

          if [ -f logo.jpg ]; then
            cp logo.jpg _site/
          fi

          if [ -d uploads ]; then
            cp -r uploads _site/
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
