backend:
  name: github
  repo: gttracker/globalterrorismtracker.com
  branch: main
  base_url: https://gtt-github-oauth.gtt-globalterrorismtracker.workers.dev
  auth_endpoint: /auth

media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "reports"
    label: "Reports"
    folder: "content/reports"
    create: true
    delete: true
    slug: "{{year}}-{{month}}"

    fields:

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Year"
        name: "year"
        widget: "number"

      - label: "Month"
        name: "month"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Publish File (PDF/DOCX)"
        name: "file"
        widget: "gtt-file"
        required: true


  - name: "analysis"
    label: "Analysis"
    folder: "content/analysis"
    create: true
    delete: true
    slug: "{{year}}-{{month}}"

    fields:

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Year"
        name: "year"
        widget: "number"

      - label: "Month/Date"
        name: "month"
        widget: "string"

      - label: "Description/Summary"
        name: "description"
        widget: "text"

      - label: "Publish File (PDF/DOCX)"
        name: "file"
        widget: "gtt-file"
        required: true
