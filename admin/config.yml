```yaml
backend:
  name: github
  repo: gttracker/globalterrorismtracker.com
  branch: main
  base_url: https://gtt-github-oauth.gtt-globalterrorismtracker.workers.dev
  auth_endpoint: /auth

media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "reports"
    label: "Reports"
    folder: "content/reports"
    create: true
    delete: true
    slug: "{{year}}-{{month}}"

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - { label: "Year", name: "year", widget: "number" }

      - { label: "Month", name: "month", widget: "string" }

      - { label: "Description", name: "description", widget: "text" }

      - label: "Report Content"
        name: "body"
        widget: "richtext"
        required: false
        buttons:
          - bold
          - italic
          - strikethrough
          - link
          - heading-one
          - heading-two
          - heading-three
          - heading-four
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
          - code-block
        modes:
          - rich_text
          - raw

      - label: "Report File"
        name: "file"
        widget: "file"
        required: false


  - name: "analysis"
    label: "Analysis"
    folder: "content/analysis"
    create: true
    delete: true
    slug: "{{slug}}"

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - { label: "Date", name: "date", widget: "datetime" }

      - { label: "Summary", name: "summary", widget: "text" }

      - label: "Content"
        name: "body"
        widget: "richtext"
        required: false
        buttons:
          - bold
          - italic
          - strikethrough
          - link
          - heading-one
          - heading-two
          - heading-three
          - heading-four
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
          - code-block
        modes:
          - rich_text
          - raw
```
