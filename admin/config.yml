media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "reports"
    label: "Reports"
    folder: "content/reports"
    create: true
    delete: true
    slug: "{{year}}-{{month}}"

    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Month", name: "month", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Upload PDF/DOCX", name: "file", widget: "file", required: true }


  - name: "analysis"
    label: "Analysis"
    folder: "content/analysis"
    create: true
    delete: true
    slug: "{{year}}-{{month}}"

    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Month", name: "month", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Upload PDF/DOCX", name: "file", widget: "file", required: true }
