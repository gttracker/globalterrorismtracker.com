<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">

  <title>GTT Admin</title>

  <style>
    body {
      margin: 0;
      background: #f5f3ee;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .gtt-control {
      padding: 25px 30px;
      background: #111;
      color: white;
    }

    .gtt-control h2 {
      margin: 0 0 15px;
    }

    #site-status {
      margin-bottom: 15px;
      font-weight: bold;
    }

    .gtt-control button {
      padding: 10px 18px;
      margin-right: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .lock-btn {
      background: white;
      color: #111;
    }

    .unlock-btn {
      background: #b00000;
      color: white;
    }

    #site-message {
      margin-top: 12px;
      font-size: 14px;
    }

    #nc-root {
      min-height: 700px;
    }
  </style>
</head>

<body>

  <!-- GTT SITE CONTROL -->

  <div class="gtt-control">

    <h2>GTT Website Control</h2>

    <div id="site-status">
      Checking website status...
    </div>

    <button class="lock-btn" onclick="lockSite()">
      🔒 Lock Site
    </button>

    <button class="unlock-btn" onclick="unlockSite()">
      🔓 Unlock Site
    </button>

    <div id="site-message"></div>

  </div>


  <!-- DECAP CMS -->

  <div id="nc-root"></div>


  <script>

    const CONTROL_URL =
      "https://gtt-site-control.gtt-globalterrorismtracker.workers.dev";


    async function checkStatus() {

      try {

        const response =
          await fetch(CONTROL_URL + "/status");

        const data =
          await response.json();

        if (data.status === "unlocked") {

          document.getElementById("site-status").innerHTML =
            "🟢 Website Status: UNLOCKED";

        } else {

          document.getElementById("site-status").innerHTML =
            "🔴 Website Status: LOCKED";

        }

      } catch (error) {

        document.getElementById("site-status").innerHTML =
          "⚠️ Unable to check website status.";

      }

    }


    async function lockSite() {

      try {

        const response =
          await fetch(CONTROL_URL + "/lock");

        const data =
          await response.json();

        if (data.success) {

          document.getElementById("site-message").innerHTML =
            "Website locked successfully.";

          checkStatus();

        }

      } catch (error) {

        document.getElementById("site-message").innerHTML =
          "Unable to lock website.";

      }

    }


    async function unlockSite() {

      try {

        const response =
          await fetch(CONTROL_URL + "/unlock");

        const data =
          await response.json();

        if (data.success) {

          document.getElementById("site-message").innerHTML =
            "Website unlocked successfully.";

          checkStatus();

        }

      } catch (error) {

        document.getElementById("site-message").innerHTML =
          "Unable to unlock website.";

      }

    }


    checkStatus();

  </script>


  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

</body>
</html>
